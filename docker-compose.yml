# Local/demo stack — see docs/deployment.md. Not a production Kubernetes manifest: single SQL
# Server instance, no secrets manager, no replicas. Copy .env.example to .env first.
name: ecommerce

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${SQL_SA_PASSWORD:?Copy .env.example to .env and set SQL_SA_PASSWORD}"
    ports:
      - "1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # Backs Catalog's storefront product-query cache (Phase 22, docs/deployment.md) — the first real
  # reader of this container since it was provisioned in Phase 13.
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  store-web:
    build:
      context: .
      dockerfile: src/Web/Store.Web/Dockerfile
    depends_on:
      sqlserver:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: "Production"
      ApplyMigrationsOnStartup: "true"
      ConnectionStrings__Database: "Server=sqlserver;Database=ECommerce;User Id=sa;Password=${SQL_SA_PASSWORD};TrustServerCertificate=True"
      # No auth on the compose-local Redis (see the redis service above) — the connection string
      # is just a host:port, not a credential, unlike SQL_SA_PASSWORD/Payments__WebhookSecret.
      ConnectionStrings__Redis: "redis:6379"
      # Dev-only fake value (see docs/security.md) — safe to inline here, unlike SQL_SA_PASSWORD.
      Payments__WebhookSecret: "dev-fake-gateway-webhook-secret-not-a-real-credential"
    ports:
      - "8080:8080"

  store-worker:
    build:
      context: .
      dockerfile: src/Workers/Store.Worker/Dockerfile
    depends_on:
      sqlserver:
        condition: service_healthy
      store-web:
        condition: service_started
    environment:
      ApplyMigrationsOnStartup: "true"
      ConnectionStrings__Database: "Server=sqlserver;Database=ECommerce;User Id=sa;Password=${SQL_SA_PASSWORD};TrustServerCertificate=True"
      Payments__WebhookSecret: "dev-fake-gateway-webhook-secret-not-a-real-credential"

volumes:
  sqlserver-data:
