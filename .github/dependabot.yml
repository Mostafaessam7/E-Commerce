version: 2

# Routine version updates are OFF: every open-pull-requests-limit below is 0.
#
# These repos are kept at a single `main` branch with no long-lived branches, and a weekly
# stream of version-bump PRs meant a steady stream of branches to merge or close. Setting the
# limit to 0 is the documented way to stop that without deleting this file.
#
# Security updates are NOT affected. Dependabot ignores the open-PR limit for security
# advisories, so a dependency with a known vulnerability still opens a PR. What stops is only
# the "a newer version exists" churn.
#
# To bring routine updates back, set the limits to a non-zero number again. The grouping below
# is kept for that reason.

updates:
  # NuGet versions are centrally managed in Directory.Packages.props (Central Package Management),
  # so Dependabot edits that one file rather than 30+ csproj files. Grouped deliberately: the
  # Microsoft/EF/ASP.NET packages move in lockstep with the .NET release train and are meaningless
  # to review one at a time, so they arrive as a single PR instead of a dozen.
  - package-ecosystem: nuget
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    groups:
      microsoft:
        patterns:
          - "Microsoft.*"
          - "System.*"
      test-tooling:
        patterns:
          - "xunit*"
          - "FluentAssertions"
          - "coverlet.*"

  # Keeps the pinned action versions in .github/workflows current — the CI gate added alongside
  # this file only covers NuGet, not the actions the workflow itself runs.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
